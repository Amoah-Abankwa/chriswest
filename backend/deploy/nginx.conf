# Example Nginx site for the two addresses: the school (SCHOOL_HOST) and the admin area
# (PLATFORM_ADMIN_HOST). One certificate covering both names is enough, e.g.:
#   certbot certonly --nginx -d portal.myschool.edu.gh -d admin.myschool.edu.gh

# Sign-in, reset and contact endpoints get a per-address limit here as well as in the app,
# so floods are dropped before they reach Node.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# Reject unknown hosts outright; never fall through to a default school.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;
    server_name portal.myschool.edu.gh admin.myschool.edu.gh;

    ssl_certificate     /etc/letsencrypt/live/portal.myschool.edu.gh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.myschool.edu.gh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Browsers only ever use HTTPS for these hosts from now on.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    client_max_body_size 10m;
    client_body_timeout 30s;
    send_timeout 60s;

    location ~ ^/api/v1/(auth/(login|forgot-password|reset-password|activate)|public/contact) {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4016;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;  # overwrite anything the client sent
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4016;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

server {
    listen 80;
    server_name portal.myschool.edu.gh admin.myschool.edu.gh;
    return 301 https://$host$request_uri;
}
